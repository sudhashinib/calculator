<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
  :root{
    --body-bg:#1c1b1f;
    --case:#2a2830;
    --case-edge:#151318;
    --screen-bg:#0d1a10;
    --screen-glow:#8fe6a0;
    --key-bg:#38353f;
    --key-bg-op:#c9622a;
    --key-bg-eq:#8fe6a0;
    --key-text:#f2f0ee;
    --key-text-eq:#0d1a10;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--body-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', system-ui, sans-serif;
    min-height:100%;
  }
  .device{
    width:320px;
    max-width:92vw;
    background:var(--case);
    border-radius:22px;
    padding:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px var(--case-edge);
  }
  .brand{
    font-size:11px;
    letter-spacing:.08em;
    color:#8a8692;
    margin:0 4px 14px;
  }
  .screen{
    background:var(--screen-bg);
    border-radius:10px;
    padding:22px 16px 14px;
    margin-bottom:18px;
    text-align:right;
    overflow:hidden;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.6);
  }
  .expr{
    font-family:'Consolas','Courier New',monospace;
    font-size:14px;
    color:#4f8f5c;
    min-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result{
    font-family:'Consolas','Courier New',monospace;
    font-size:38px;
    color:var(--screen-glow);
    text-shadow:0 0 12px rgba(143,230,160,.45);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  button{
    border:none;
    border-radius:10px;
    background:var(--key-bg);
    color:var(--key-text);
    font-size:18px;
    padding:16px 0;
    cursor:pointer;
    transition:transform .06s ease, filter .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:scale(.94); filter:brightness(1.15);}
  button:focus-visible{outline:2px solid var(--screen-glow); outline-offset:2px;}
  .op{background:var(--key-bg-op);}
  .eq{background:var(--key-bg-eq); color:var(--key-text-eq); font-weight:600;}
  .wide{grid-column:span 2;}
  .muted{color:#b7b3bd; font-size:15px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --body-bg:#e7e4de;
    }
  }
</style>
</head>
<body>
  <div class="device">
    <p class="brand">MODEL 02 · ARITHMETIC</p>
    <div class="screen">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="muted" data-action="clear">C</button>
      <button class="muted" data-action="backspace">⌫</button>
      <button class="muted" data-action="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="wide" data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

<script>
(function(){
  const exprEl = document.getElementById('expr');
  const resEl = document.getElementById('result');

  let a = null, op = null, current = '0', justEvaluated = false;

  function fmt(n){
    if (!isFinite(n)) return 'Error';
    let s = String(Math.round(n * 1e9) / 1e9);
    if (s.length > 14) s = Number(n).toExponential(6);
    return s;
  }

  function render(){
    resEl.textContent = current;
    exprEl.textContent = (a !== null && op) ? `${fmt(a)} ${op}` : '\u00a0';
  }

  function inputDigit(d){
    if (justEvaluated){ current = '0'; op = null; a = null; justEvaluated = false; }
    if (current === '0' && d !== '.') current = d;
    else if (d === '.' && current.includes('.')) return;
    else current += d;
    render();
  }

  function chooseOp(o){
    if (a !== null && op && !justEvaluated) compute();
    a = parseFloat(current);
    op = o;
    current = '0';
    justEvaluated = false;
    render();
  }

  function compute(){
    if (a === null || !op) return;
    const b = parseFloat(current);
    let r;
    switch(op){
      case '+': r = a + b; break;
      case '−': r = a - b; break;
      case '×': r = a * b; break;
      case '÷': r = b === 0 ? NaN : a / b; break;
    }
    current = fmt(r);
    a = null; op = null;
    justEvaluated = true;
    render();
  }

  function clearAll(){ a = null; op = null; current = '0'; justEvaluated = false; render(); }
  function backspace(){
    if (justEvaluated) return clearAll();
    current = current.length > 1 ? current.slice(0, -1) : '0';
    render();
  }
  function percent(){ current = fmt(parseFloat(current) / 100); render(); }

  document.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (btn.dataset.num !== undefined) inputDigit(btn.dataset.num);
      else if (btn.dataset.op) chooseOp(btn.dataset.op);
      else if (btn.dataset.action === 'equals') compute();
      else if (btn.dataset.action === 'clear') clearAll();
      else if (btn.dataset.action === 'backspace') backspace();
      else if (btn.dataset.action === 'percent') percent();
      else if (btn.dataset.action === 'decimal') inputDigit('.');
    });
  });

  const opMap = {'+':'+','-':'−','*':'×','/':'÷'};
  window.addEventListener('keydown', (e)=>{
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDigit('.');
    else if (opMap[e.key]) chooseOp(opMap[e.key]);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); compute(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percent();
  });

  render();
})();
</script>
</body>
</html>
